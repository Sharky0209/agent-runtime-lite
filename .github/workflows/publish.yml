name: Publish to npm (one-time first publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Verify package identity
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='agent-runtime-lite'||p.version!=='0.1.2'){console.error('unexpected package',p.name,p.version); process.exit(1)} console.log(p.name+'@'+p.version)"
          npm view agent-runtime-lite@0.1.2 version && { echo 'ALREADY PUBLISHED - aborting'; exit 1; } || echo 'not published yet, proceeding'
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
