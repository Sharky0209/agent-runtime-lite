name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit and process integration tests
        run: npm test
      - name: Run independent example
        run: npm run example
